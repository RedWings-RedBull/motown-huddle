name: Bug report
description: Something is wrong on the site or in the pipeline
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the page URL or the command you ran.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: week
    attributes:
      label: Season / week (if data related)
      placeholder: 2026 / week 4
